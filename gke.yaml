pipeline:
  name: gke-terraform
  identifier: gketerraform
  projectIdentifier: default_project
  orgIdentifier: default
  tags: {}

# Code Generated by Sidekick is for learning and experimentation purposes only.

  properties:
    ci:
      codebase:
        connectorRef: git_connector
        repoName: your-infra-repo
        build: <+input>

  stages:
    - stage:
        name: Terraform_Apply_GKE
        identifier: Terraform_Apply_GKE
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_delegate_cluster_connector
              namespace: harness-ci
              os: Linux
          execution:
            steps:
              - step:
                  name: terraform init + apply (GKE)
                  identifier: tf_apply_gke
                  type: Run
                  spec:
                    shell: Sh
                    image: hashicorp/terraform:1.7.5
                    command: |
                      set -euo pipefail

                      # Path to your single-env Terraform "template"
                      cd infra/terraform/gke/dev

                      # Write GCP Service Account JSON from Harness secret to a file
                      echo "$GCP_SA_JSON" > /tmp/gcp-sa.json
                      export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json

                      terraform -version
                      terraform init -input=false
                      terraform apply -input=false -auto-approve
                  envVariables:
                    # Store the full Service Account JSON as a Harness secret text value
                    # (e.g., secret name: gcp_sa_json_dev)
                    GCP_SA_JSON: "<+secrets.getValue(\"gcp_sa_json_dev\")>"

                    # Optional (only if your Terraform uses these env vars)
                    # GOOGLE_PROJECT: "my-gcp-project"
                    # GOOGLE_REGION: "us-central1"
                    # TF_VAR_project_id: "my-gcp-project"
                    # TF_VAR_region: "us-central1"
